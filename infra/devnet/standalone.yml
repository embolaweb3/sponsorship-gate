# Local Midnight devnet (node + indexer + proof server), version-pinned.
#
# WHY PINNED: wave 1's deployment attempt hung forever at transaction
# submission. Root cause (found in wave 2): the containers in use were
# node 1.0.0 / indexer 4.3.3 / proof-server 8.1.0, newer than the ledger the
# stable SDK line (midnight-js 4.1.1, ledger-v8 8.1.2, wallet-sdk-facade 4.1.0)
# speaks. The node silently dropped the transactions: no error, no block.
# node 0.22.3 + indexer 4.0.0 are the pinned pair the SDK line is validated
# against; proof-server 8.1.0 produced the proofs for every transaction in
# this repo's evidence. Topology
# and healthchecks follow midnightntwrk/example-counter's standalone.yml.
#
# Usage:  docker compose -f infra/devnet/standalone.yml --env-file infra/devnet/standalone.env up -d
name: sponsorship-gate-devnet

services:
  proof-server:
    container_name: 'sg-proof-server'
    image: 'midnightntwrk/proof-server:8.1.0'
    command: ['midnight-proof-server -v']
    ports:
      - '6300:6300'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:6300/version']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  indexer:
    container_name: 'sg-indexer'
    image: 'midnightntwrk/indexer-standalone:4.0.0'
    env_file: standalone.env
    ports:
      - '8088:8088'
    environment:
      RUST_LOG: 'indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,info'
      APP__APPLICATION__NETWORK_ID: 'undeployed'
    healthcheck:
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy

  node:
    image: 'midnightntwrk/midnight-node:0.22.3'
    container_name: 'sg-node'
    ports:
      - '9944:9944'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9944/health']
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 20s
    environment:
      CFG_PRESET: 'dev'
      SIDECHAIN_BLOCK_BENEFICIARY: '04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e'
